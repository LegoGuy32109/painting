<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f0e0ae">
    <title>Joy of Painting</title>
    <link rel="stylesheet" href="/base.css">
    <link rel="stylesheet" href="/gallery.css">
    <script type="module" src="/site-nav.js?v=3"></script>
    <script type="module" src="/painting-parade.js?v=3"></script>
  </head>
  <body class="landing-page">
    <painting-parade mode="ambient"
      aria-label="Paintings being created"></painting-parade>
    <site-nav></site-nav>
    <main class="landing-main shell">
      <section class="hero pixel-panel">
        <p class="eyebrow">A tiny public painting room</p>
        <h1 class="page-title">Paint one square at a time.</h1>
        <p class="hero-copy">
          Make a 16 by 16 painting in your browser. Watch other canvases take
          shape, then sign yours into the collection.
        </p>
        <div class="hero-actions">
          <a class="pixel-button primary-action"
            href="/editor">Start painting</a>
          <a class="pixel-button" href="/display">Watch the room</a>
        </div>
      </section>
      <p
        class="landing-note">No account required. Your browser is your guest profile.</p>
    </main>
  </body>
</html>
