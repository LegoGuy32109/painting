<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f0e0ae">
    <title>Joy of Painting</title>
    <link rel="stylesheet" href="/style.css">
    <script type="module" src="/datastar.js"></script>
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <main
      class="app"
      data-signals='{
        "paint": {
          "tool": "paint",
          "selection": { "source": null, "index": null, "color": null },
          "brushSize": 1,
          "opacity": 100,
          "erase": false,
          "canUndo": false,
          "undoRequest": 0,
          "newCanvasRequest": 0
        },
        "palette": {
          "baseAvailable": [true, true, true, true, true, true, true, true, true, true, true, true, true, true, true, true],
          "customWells": [
            { "totalRed": 0, "totalGreen": 0, "totalBlue": 0, "totalMaximum": 0, "numberOfColors": 0 },
            { "totalRed": 0, "totalGreen": 0, "totalBlue": 0, "totalMaximum": 0, "numberOfColors": 0 },
            { "totalRed": 0, "totalGreen": 0, "totalBlue": 0, "totalMaximum": 0, "numberOfColors": 0 },
            { "totalRed": 0, "totalGreen": 0, "totalBlue": 0, "totalMaximum": 0, "numberOfColors": 0 },
            { "totalRed": 0, "totalGreen": 0, "totalBlue": 0, "totalMaximum": 0, "numberOfColors": 0 },
            { "totalRed": 0, "totalGreen": 0, "totalBlue": 0, "totalMaximum": 0, "numberOfColors": 0 },
            { "totalRed": 0, "totalGreen": 0, "totalBlue": 0, "totalMaximum": 0, "numberOfColors": 0 },
            { "totalRed": 0, "totalGreen": 0, "totalBlue": 0, "totalMaximum": 0, "numberOfColors": 0 },
            { "totalRed": 0, "totalGreen": 0, "totalBlue": 0, "totalMaximum": 0, "numberOfColors": 0 },
            { "totalRed": 0, "totalGreen": 0, "totalBlue": 0, "totalMaximum": 0, "numberOfColors": 0 },
            { "totalRed": 0, "totalGreen": 0, "totalBlue": 0, "totalMaximum": 0, "numberOfColors": 0 },
            { "totalRed": 0, "totalGreen": 0, "totalBlue": 0, "totalMaximum": 0, "numberOfColors": 0 }
          ]
        }
      }'
    >
      <header class="app-header">
        <h1 class="title">Joy of Painting</h1>
        <span class="app-domain">paint.joshhale.me</span>
      </header>

      <div class="painting-workspace">
        <section class="painting-stage" aria-label="Painting area">
          <div class="canvas-zone">
            <paint-canvas
              canvas-id="local-prototype"
              data-attr:paint-color="$paint.selection.color || ''"
              data-attr:brush-size="$paint.brushSize"
              data-attr:erase="$paint.erase"
              data-attr:opacity="$paint.opacity"
              data-attr:tool="$paint.tool"
              data-attr:undo-request="$paint.undoRequest"
              data-attr:new-canvas-request="$paint.newCanvasRequest"
              data-on:undo-availability-changed="$paint.canUndo = evt.detail.canUndo"
              data-on:color-picked="$paint.selection = { source: 'picked', index: null, color: evt.detail.color }; $paint.tool = 'paint'"
            ></paint-canvas>
          </div>
        </section>

        <section class="interface" aria-label="Painting controls">
          <div class="tool-row tool-row--paint-settings"
            aria-label="Brush and opacity controls">
            <button
              type="button"
              aria-label="Brush size 1"
              data-attr:aria-pressed="$paint.brushSize === 1 ? 'true' : 'false'"
              data-on:click="$paint.brushSize = 1"
            >B1</button>
            <button
              type="button"
              aria-label="Brush size 2"
              data-attr:aria-pressed="$paint.brushSize === 2 ? 'true' : 'false'"
              data-on:click="$paint.brushSize = 2"
            >B2</button>
            <button
              type="button"
              aria-label="Brush size 3"
              data-attr:aria-pressed="$paint.brushSize === 3 ? 'true' : 'false'"
              data-on:click="$paint.brushSize = 3"
            >B3</button>
            <button
              type="button"
              aria-label="Brush size 4"
              data-attr:aria-pressed="$paint.brushSize === 4 ? 'true' : 'false'"
              data-on:click="$paint.brushSize = 4"
            >B4</button>
            <button
              type="button"
              aria-label="25 percent opacity"
              data-attr:aria-pressed="$paint.opacity === 25 ? 'true' : 'false'"
              data-on:click="$paint.opacity = 25"
            >25%</button>
            <button
              type="button"
              aria-label="50 percent opacity"
              data-attr:aria-pressed="$paint.opacity === 50 ? 'true' : 'false'"
              data-on:click="$paint.opacity = 50"
            >50%</button>
            <button
              type="button"
              aria-label="75 percent opacity"
              data-attr:aria-pressed="$paint.opacity === 75 ? 'true' : 'false'"
              data-on:click="$paint.opacity = 75"
            >75%</button>
            <button
              type="button"
              aria-label="100 percent opacity"
              data-attr:aria-pressed="$paint.opacity === 100 ? 'true' : 'false'"
              data-on:click="$paint.opacity = 100"
            >100</button>
          </div>

          <div class="tool-row tool-row--history" aria-label="Canvas controls">
            <button
              type="button"
              class="action-wide"
              disabled
              data-attr:disabled="$paint.canUndo ? null : true"
              data-on:click="$paint.undoRequest++"
            >Undo</button>
            <button
              type="button"
              class="action-wide"
              data-on:click="$paint.erase = !$paint.erase"
              data-text="'Erase: ' + ($paint.erase ? 'on' : 'off')"
            >Erase: off</button>
            <mc-color
              class="selected-color"
              aria-label="Selected paint color"
              data-attr:color="$paint.selection.color || ''"
            ></mc-color>
            <button
              type="button"
              class="action-tile"
              aria-label="Pick a color from the canvas"
              data-attr:aria-pressed="$paint.tool === 'picker' ? 'true' : 'false'"
              data-on:click="$paint.tool = 'picker'"
            >Pick</button>
            <button
              type="button"
              class="action-tile"
              aria-label="Water: coming soon"
              disabled
            >H2O</button>
            <button
              type="button"
              class="action-tile"
              aria-label="Add dye: coming soon"
              disabled
            >+</button>
          </div>

          <paint-palette
            data-attr:palette-state="JSON.stringify($palette)"
            data-attr:selected-source="$paint.selection.source || ''"
            data-attr:selected-index="$paint.selection.index === null ? '' : $paint.selection.index"
            data-attr:selected-color="$paint.selection.color || ''"
            data-on:palette-color-selected="$paint.selection = evt.detail; $paint.erase = false"
          ></paint-palette>

        </section>
      </div>
    </main>
  </body>
</html>
