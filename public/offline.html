<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f0e0ae">
    <title>Offline · Joy of Painting</title>
    <link rel="stylesheet" href="/base.css">
  </head>
  <body>
    <main class="shell" style="min-height:100dvh; display:flex; align-items:center; justify-content:center;">
      <section class="pixel-panel" style="max-width:32rem; padding:2rem; text-align:center;">
        <h1 class="page-title">You're offline</h1>
        <p>
          This page hasn't been visited before, so there is nothing cached
          for it yet. Your paintings are safe — anything already open in the
          editor keeps working and saves locally until the connection comes
          back.
        </p>
        <p>
          <a class="pixel-button primary-action" href="/editor">Go to the editor</a>
        </p>
      </section>
    </main>
