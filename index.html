<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f0e0ae">
    <title>Joy of Painting</title>
    <link rel="stylesheet" href="/style.css">
    <script type="module" src="/datastar.js"></script>
  </head>
  <body>
    <main class="app">
      <h1 class="title">Joy of Painting</h1>

      <section class="canvas-placeholder"
        aria-label="Painting canvas"></section>

      <section class="interface" aria-label="Painting controls">
        <div class="tool-row" aria-label="Paint controls">
          <button type="button">Undo</button>
          <button type="button">Erase: off</button>
          <button type="button">Brush: 1</button>
          <button type="button">Opacity: 100%</button>
        </div>

        <section class="palette-section" aria-label="Base colors">
          <div class="base-colors">
            <label><input type="radio" name="paint-color" aria-label="Black"><mc-color style="--color: var(--mc-black)"></mc-color></label>
            <label><input type="radio" name="paint-color" aria-label="Red"><mc-color style="--color: var(--mc-red)"></mc-color></label>
            <label><input type="radio" name="paint-color" aria-label="Green"><mc-color style="--color: var(--mc-green)"></mc-color></label>
            <label><input type="radio" name="paint-color" aria-label="Brown"><mc-color style="--color: var(--mc-brown)"></mc-color></label>
            <label><input type="radio" name="paint-color" aria-label="Blue"><mc-color style="--color: var(--mc-blue)"></mc-color></label>
            <label><input type="radio" name="paint-color" aria-label="Purple"><mc-color style="--color: var(--mc-purple)"></mc-color></label>
            <label><input type="radio" name="paint-color" aria-label="Cyan"><mc-color style="--color: var(--mc-cyan)"></mc-color></label>
            <label><input type="radio" name="paint-color" aria-label="Light gray"><mc-color style="--color: var(--mc-light-gray)"></mc-color></label>
            <label><input type="radio" name="paint-color" aria-label="Gray"><mc-color style="--color: var(--mc-gray)"></mc-color></label>
            <label><input type="radio" name="paint-color" aria-label="Pink"><mc-color style="--color: var(--mc-pink)"></mc-color></label>
            <label><input type="radio" name="paint-color" aria-label="Lime"><mc-color style="--color: var(--mc-lime)"></mc-color></label>
            <label><input type="radio" name="paint-color" aria-label="Yellow"><mc-color style="--color: var(--mc-yellow)"></mc-color></label>
            <label><input type="radio" name="paint-color" aria-label="Light blue"><mc-color style="--color: var(--mc-light-blue)"></mc-color></label>
            <label><input type="radio" name="paint-color" aria-label="Magenta"><mc-color style="--color: var(--mc-magenta)"></mc-color></label>
            <label><input type="radio" name="paint-color" aria-label="Orange"><mc-color style="--color: var(--mc-orange)"></mc-color></label>
            <label><input type="radio" name="paint-color" aria-label="White"><mc-color style="--color: var(--mc-white)"></mc-color></label>
          </div>
        </section>

        <section class="palette-section" aria-label="Custom mixing wells">
          <div class="mixing-wells">
            <label><input type="radio" name="paint-color" aria-label="Custom well 1, empty"><mc-color data-empty></mc-color></label>
            <label><input type="radio" name="paint-color" aria-label="Custom well 2, empty"><mc-color data-empty></mc-color></label>
            <label><input type="radio" name="paint-color" aria-label="Custom well 3, empty"><mc-color data-empty></mc-color></label>
            <label><input type="radio" name="paint-color" aria-label="Custom well 4, empty"><mc-color data-empty></mc-color></label>
            <label><input type="radio" name="paint-color" aria-label="Custom well 5, empty"><mc-color data-empty></mc-color></label>
            <label><input type="radio" name="paint-color" aria-label="Custom well 6, empty"><mc-color data-empty></mc-color></label>
            <label><input type="radio" name="paint-color" aria-label="Custom well 7, empty"><mc-color data-empty></mc-color></label>
            <label><input type="radio" name="paint-color" aria-label="Custom well 8, empty"><mc-color data-empty></mc-color></label>
            <label><input type="radio" name="paint-color" aria-label="Custom well 9, empty"><mc-color data-empty></mc-color></label>
            <label><input type="radio" name="paint-color" aria-label="Custom well 10, empty"><mc-color data-empty></mc-color></label>
            <label><input type="radio" name="paint-color" aria-label="Custom well 11, empty"><mc-color data-empty></mc-color></label>
            <label><input type="radio" name="paint-color" aria-label="Custom well 12, empty"><mc-color data-empty></mc-color></label>
          </div>
          <div class="palette-actions">
            <button type="button">Add dye</button>
            <button type="button" disabled>Picker</button>
            <button type="button">Water</button>
          </div>
        </section>

        <div class="tool-row tool-row--three" aria-label="Canvas controls">
          <button type="button">Canvas: small</button>
          <button type="button">Surface: opaque</button>
          <button type="button">New canvas</button>
        </div>
      </section>
    </main>
  </body>
</html>
